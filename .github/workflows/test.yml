name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node --test (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Enforce coverage gate (Line 100% / Func 100% / Branch >= 90%)
        run: npm run coverage
