<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪒 면도 게임 - Shaving Game v1.0</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Razor Cursor -->
    <div id="razorCursor">🪒</div>

    <!-- Start & Stage Selector Modal -->
    <div class="overlay" id="startModal">
        <div class="overlay-box">
            <h2>🪒 면도 게임 모드 선택</h2>
            <div style="font-size:13px;color:#8892b0;margin-bottom:8px;">
                제공된 기본 아스키 아트 또는 직접 올려주신 사진으로 게임을 즐겨보세요!
            </div>

            <!-- Option A: Preset Stage -->
            <button class="btn-primary" id="startPresetBtn" style="margin-bottom:12px;">
                🎮 기본 스테이지로 시작 (기본 아스키 아트)
            </button>

            <div style="border-top:1px solid #2d3345;padding-top:12px;margin-top:4px;">
                <div style="font-size:14px;font-weight:bold;color:#4ecdc4;margin-bottom:8px;">
                    📷 내 사진으로 커스텀 게임 만들기
                </div>
                
                <div class="upload-drop-zone" id="uploadDropZone">
                    <span style="font-size:24px;">📁</span>
                    <span style="font-size:13px;">사진 파일을 선택하거나 이곳으로 드롭하세요</span>
                    <span style="font-size:11px;color:#8892b0;">(PNG, JPG, WEBP 이미지 지원 - 100% 브라우저 내 처리)</span>
                    <img id="photoPreview" class="photo-preview" alt="선택한 이미지 미리보기" />
                </div>
                <input type="file" id="photoInput" accept="image/*" style="display:none;" />

                <button class="btn-primary" id="startCustomBtn" disabled style="margin-top:12px;opacity:0.5;">
                    🪒 선택한 사진으로 게임 시작
                </button>
            </div>
        </div>
    </div>

    <!-- Main Game Container -->
    <div class="game-container" id="gameContainer" style="display:none">
        
        <!-- Header / HUD Stats -->
        <div class="header">
            <span class="header-title">🪒 면도 게임</span>
            <div class="stat-group">
                <span class="stat-item">점수 <span class="stat-val" id="scoreVal">0</span></span>
                <span class="stat-item">⏱ <span class="stat-val" id="timerVal">60</span>초</span>
                <span class="stat-item">털 <span class="stat-val" id="remainVal">--</span></span>
                <button class="action-btn" id="changeStageBtn" style="margin-left:8px;">📂 스테이지 변경</button>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>

        <!-- ASCII Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <span>🪒 마우스를 긁거나 터치하여 면도하세요 (휠 스크롤로 크기 조절)</span>
            <div class="brush-size-picker">
                <span>면도날 크기:</span>
                <button class="brush-btn active" data-radius="1">3x3</button>
                <button class="brush-btn" data-radius="3">7x7</button>
                <button class="brush-btn" data-radius="5">11x11</button>
                <button class="brush-btn" data-radius="7">15x15</button>
            </div>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div class="overlay" id="gameOverlay" style="display:none;">
        <div class="overlay-box">
            <h2 id="overlayTitle">게임 종료!</h2>
            <div class="final-score" id="overlayFinalScore">0</div>
            <div class="msg" id="overlayMsg">결과</div>
            <div class="detail" id="overlayDetail"></div>
            <button class="btn-primary" id="restartBtn">🔄 다시 하기</button>
        </div>
    </div>

    <!-- ES Module Main Script -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
